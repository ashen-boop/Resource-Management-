  // ============================================================
  //  KIOSK MODE
  // ============================================================

  function renderKiosk() {
    const container = document.getElementById('kioskContent');
    const today = getTodayStr();
    const todayBookings = appData.bookings.filter(b => b.date === today);
    const availableNow = appData.resources.filter(r => r.available);

    container.innerHTML = `
      <div class="stats-grid mb-3">
        <div class="stat-card">
          <div class="stat-label">Available Now</div>
          <div class="stat-value">${availableNow.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Today's Bookings</div>
          <div class="stat-value">${todayBookings.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Current Time</div>
          <div class="stat-value" style="font-size:1.2rem;">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      </div>

      <h2 class="mb-2">Available Resources</h2>
      <div class="resource-grid">
        ${availableNow.map(r => `
          <div class="resource-card" onclick="quickBook('${r.id}')" style="cursor:pointer;">
            <div class="rc-top">
              <div class="rc-name">${r.photo || ''} ${r.name}</div>
              <span class="rc-type">${r.type}</span>
            </div>
            <div class="rc-meta"><span><i class="fas fa-map-pin"></i> ${r.location}</span></div>
            <button class="btn btn-primary w-full mt-1"><i class="fas fa-bolt"></i> Quick Book</button>
          </div>
        `).join('')}
      </div>

      <h2 class="mb-2 mt-3">In Use</h2>
      <div class="log-list">
        ${appData.resources.filter(r => !r.available).map(r => {
          const b = appData.bookings.find(x => x.resourceId === r.id && x.date === today && !isPastDate(x.date));
          return `
            <div class="log-item">
              <div class="log-left">
                <i class="fas fa-circle" style="color:var(--danger); font-size:0.5rem;"></i>
                <strong>${r.name}</strong>
                ${b ? `<span class="badge">${b.user} · until ${formatTime(b.endTime)}</span>` : '<span class="badge">Booked</span>'}
              </div>
              <button class="btn btn-xs btn-outline" onclick="checkInBooking('${b?.id || ''}')" ${!b ? 'disabled' : ''}>
                <i class="fas fa-sign-in-alt"></i> Check in
              </button>
            </div>
          `;
        }).join('') || '<div class="text-muted">All resources are available.</div>'}
      </div>
    `;
  }

  // ============================================================
  //  MODAL SYSTEM
  // ============================================================

  function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ============================================================
  //  EXPORT HELPERS
  // ============================================================

  function downloadCSV(rows, filename) {
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportAllCSV() {
    const rows = [['Resource', 'User', 'Date', 'Start', 'End', 'Purpose', 'Status']];
    appData.bookings.forEach(b => rows.push([b.resourceName, b.user, b.date, b.startTime, b.endTime, b.purpose, b.status]));
    downloadCSV(rows, 'all-bookings.csv');
  }

  function showNotifications() {
    const pending = appData.approvals.filter(a => a.status === 'pending').length;
    showToast(`You have ${pending} pending approval${pending !== 1 ? 's' : ''} and ${appData.bookings.filter(b => b.date === getTodayStr()).length} bookings today.`, 'info');
  }

  // ============================================================
  //  INIT
  // ============================================================

  function init() {
    // Apply dark mode
    if (appData.darkMode) {
      document.body.classList.add('dark');
      document.getElementById('darkModeIcon').className = 'fas fa-sun';
    }

    // Set role
    setRole(appData.currentRole || 'admin');

    // Render initial page
    navigateTo('dashboard');

    // Update approval badge
    updateApprovalBadge();

    // Periodic kiosk refresh
    setInterval(() => {
      if (kioskActive) renderKiosk();
    }, 30000);

    console.log('✅ ResourceOS initialized');
    console.log(`   ${appData.resources.length} resources · ${appData.bookings.length} bookings · ${appData.users.length} users`);
  }

  // Start the app
  init();

  // Expose functions globally for onclick handlers
  window.navigateTo = navigateTo;
  window.toggleSidebar = toggleSidebar;
  window.setRole = setRole;
  window.toggleDarkMode = toggleDarkMode;
  window.toggleKiosk = toggleKiosk;
  window.quickBook = quickBook;
  window.openResourceDetail = openResourceDetail;
  window.toggleResourceAvailability = toggleResourceAvailability;
  window.closeModal = closeModal;
  window.showModal = showModal;
  window.wizardNext = wizardNext;
  window.wizardPrev = wizardPrev;
  window.confirmBooking = confirmBooking;
  window.toggleAddon = toggleAddon;
  window.adjustEndTime = adjustEndTime;
  window.cancelBooking = cancelBooking;
  window.checkInBooking = checkInBooking;
  window.extendBooking = extendBooking;
  window.switchBookingTab = switchBookingTab;
  window.setCalendarView = setCalendarView;
  window.calendarNav = calendarNav;
  window.showDayBookings = showDayBookings;
  window.showVisitorForm = showVisitorForm;
  window.registerVisitor = registerVisitor;
  window.checkOutVisitor = checkOutVisitor;
  window.bookOnBehalf = bookOnBehalf;
  window.showResourceForm = showResourceForm;
  window.editResource = editResource;
  window.saveResource = saveResource;
  window.deleteResource = deleteResource;
  window.approveRequest = approveRequest;
  window.rejectRequest = rejectRequest;
  window.showMaintenanceForm = showMaintenanceForm;
  window.saveMaintenance = saveMaintenance;
  window.resolveMaintenance = resolveMaintenance;
  window.exportBillingCSV = exportBillingCSV;
  window.exportAuditCSV = exportAuditCSV;
  window.exportAllCSV = exportAllCSV;
  window.showNotifications = showNotifications;
  window.switchSettingsTab = switchSettingsTab;
  window.resetFilters = resetFilters;
  window.downloadICS = downloadICS;

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      if (kioskActive) toggleKiosk();
    }
  });

  console.log('🚀 ResourceOS v1.0 — Premium Resource Booking Platform');
  console.log('   Type "appData" in console to inspect data.');
</script>
