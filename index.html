<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro · Resource Booking</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1.5rem 3rem;
      color: #0b1e33;
    }

    .app {
      max-width: 1360px;
      width: 100%;
    }

    /* ----- header & stats ----- */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }
    .brand i {
      color: #2563eb;
      background: white;
      padding: 0.4rem;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    }

    .stats-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem 2rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      padding: 0.6rem 1.8rem;
      border-radius: 60px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
      border: 1px solid #e9edf4;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
    }
    .stat-item i {
      color: #2563eb;
      width: 1.2rem;
      text-align: center;
    }
    .stat-item .num {
      font-weight: 700;
      color: #0b1e33;
      margin-right: 0.15rem;
    }

    /* ----- toolbar / filters ----- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 1.2rem;
      margin: 1.2rem 0 1.8rem;
      background: white;
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.01);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem 1.2rem;
    }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #475569;
    }
    .filter-group select, .filter-group input {
      background: #f8fafc;
      border: 1px solid #dbe0e8;
      border-radius: 40px;
      padding: 0.35rem 1rem;
      font-size: 0.85rem;
      outline: none;
      transition: 0.15s;
    }
    .filter-group select:focus, .filter-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb20;
    }
    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* ----- resource grid (cards) ----- */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.8rem;
      margin: 1.2rem 0 2.5rem;
    }

    .resource-card {
      background: white;
      border-radius: 28px;
      padding: 1.5rem 1.2rem 1.4rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.02), 0 1px 4px rgba(0,20,40,0.03);
      border: 1px solid #eef2f8;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .resource-card:hover {
      border-color: #cbd9e9;
      box-shadow: 0 12px 28px -10px rgba(0,0,0,0.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .card-top h3 {
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }
    .type-badge {
      background: #eef2ff;
      color: #2563eb;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      text-transform: uppercase;
    }
    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 1rem;
      font-size: 0.8rem;
      color: #475569;
      margin: 0.2rem 0 0.5rem;
    }
    .meta-line i {
      width: 1.1rem;
      color: #64748b;
    }
    .capacity {
      background: #f1f5f9;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .status-pill {
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      margin: 0.3rem 0 0.6rem;
      align-self: flex-start;
      background: #dcfce7;
      color: #166534;
    }
    .status-pill.booked {
      background: #fee2e2;
      color: #991b1b;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn {
      border: none;
      background: #f1f5f9;
      padding: 0.35rem 1.2rem;
      border-radius: 40px;
      font-size: 0.78rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.12s;
      color: #1e293b;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-outline { background: transparent; border: 1px solid #d1d9e6; }
    .btn-outline:hover { background: #eef2ff; border-color: #2563eb; }
    .btn-ghost { background: transparent; color: #475569; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn i { font-size: 0.8rem; }

    /* ----- booking panel (advanced) ----- */
    .booking-panel {
      background: white;
      border-radius: 32px;
      padding: 1.8rem 2rem 2rem;
      border: 1px solid #e9edf4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
      margin: 1.8rem 0 1.5rem;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .panel-head h2 {
      font-weight: 600;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-head h2 i { color: #2563eb; }

    .booking-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem 1.8rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1 0 150px;
    }
    .form-group label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
    }
    .form-group input, .form-group select, .form-group textarea {
      background: #f8fafc;
      border: 1px solid #dce2ec;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      outline: none;
      transition: 0.15s;
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px #2563eb20;
    }
    .form-group textarea { border-radius: 20px; resize: vertical; min-height: 44px; }
    .form-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-lg { padding: 0.5rem 2rem; font-size: 0.9rem; }

    /* ----- log & history (enhanced) ----- */
    .log-section {
      margin-top: 2.5rem;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
    }
    .log-header h4 {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .log-header h4 i { color: #2563eb; }
    .log-actions button {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      transition: 0.1s;
    }
    .log-actions button:hover { background: #f1f5f9; color: #dc2626; }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .log-item {
      background: #fafcff;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #eef2f6;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      transition: 0.1s;
    }
    .log-item .left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .log-item .badge {
      background: #e2e8f0;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .log-item .timestamp {
      color: #64748b;
      font-size: 0.75rem;
    }
    .empty-log {
      color: #94a3b8;
      padding: 1.2rem 0.5rem;
      text-align: center;
    }

    /* responsive */
    @media (max-width: 700px) {
      body { padding: 1rem 0.8rem; }
      .top-bar { flex-direction: column; align-items: stretch; }
      .stats-group { justify-content: space-around; border-radius: 40px; }
      .toolbar { flex-direction: column; align-items: stretch; border-radius: 32px; }
      .booking-form { flex-direction: column; align-items: stretch; }
      .resource-grid { grid-template-columns: 1fr; }
      .log-item { flex-direction: column; align-items: flex-start; gap: 0.2rem; border-radius: 24px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- top bar -->
  <div class="top-bar">
    <div class="brand"><i class="fas fa-calendar-check"></i> book<span style="font-weight:300;">·</span>pro</div>
    <div class="stats-group">
      <span class="stat-item"><i class="fas fa-cubes"></i> <span class="num" id="totalResources">0</span> resources</span>
      <span class="stat-item"><i class="fas fa-check-circle"></i> <span class="num" id="availableCount">0</span> free</span>
      <span class="stat-item"><i class="fas fa-clock"></i> <span class="num" id="bookingCount">0</span> bookings</span>
      <span class="stat-item"><i class="fas fa-users"></i> <span class="num" id="uniqueUsers">0</span> users</span>
    </div>
  </div>

  <!-- toolbar / filters -->
  <div class="toolbar">
    <div class="filter-group">
      <label><i class="fas fa-filter"></i> filter</label>
      <select id="filterType"><option value="all">all types</option><option value="room">room</option><option value="equipment">equipment</option><option value="workspace">workspace</option><option value="supply">supply</option></select>
      <select id="filterStatus"><option value="all">all status</option><option value="available">available</option><option value="booked">booked</option></select>
      <input type="text" id="searchInput" placeholder="🔍 search resource..." />
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-outline" id="resetAllBtn"><i class="fas fa-undo-alt"></i> reset</button>
    </div>
  </div>

  <!-- resource grid -->
  <div class="resource-grid" id="resourceGrid"></div>

  <!-- advanced booking panel -->
  <div class="booking-panel">
    <div class="panel-head">
      <h2><i class="fas fa-pen-fancy"></i> new booking</h2>
      <span style="font-size:0.8rem; color:#64748b;"><i class="far fa-calendar-alt"></i> select resource &amp; date</span>
    </div>
    <div class="booking-form">
      <div class="form-group">
        <label><i class="fas fa-cube"></i> resource</label>
        <select id="resourceSelect"></select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-user"></i> booker</label>
        <input type="text" id="userNameInput" placeholder="Name" value="Guest" />
      </div>
      <div class="form-group">
        <label><i class="far fa-calendar"></i> date</label>
        <input type="datetime-local" id="bookingDateTime" />
      </div>
      <div class="form-group" style="flex:1.2;">
        <label><i class="fas fa-pencil-alt"></i> note</label>
        <input type="text" id="bookingNote" placeholder="optional note" />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-lg" id="bookBtn"><i class="fas fa-bookmark"></i> book</button>
      </div>
    </div>
  </div>

  <!-- log -->
  <div class="log-section">
    <div class="log-header">
      <h4><i class="fas fa-list-ul"></i> activity log <span style="font-weight:400; font-size:0.8rem; color:#64748b;" id="logCount">(0)</span></h4>
      <div class="log-actions">
        <button id="clearLogBtn"><i class="fas fa-trash-alt"></i> clear</button>
      </div>
    </div>
    <div class="log-list" id="logList"></div>
  </div>
</div>

<script>
  (function() {
    // ----- UPDATED STATE: 10 resources (5 new) -----
    let resources = [
      { id: 'r1', name: 'Meeting Room A', type: 'room', available: true, capacity: 8, location: 'Floor 3' },
      { id: 'r2', name: 'Projector X1', type: 'equipment', available: true, capacity: null, location: 'AV closet' },
      { id: 'r3', name: 'Desk 12', type: 'workspace', available: true, capacity: 1, location: 'Open space' },
      { id: 'r4', name: 'Whiteboard', type: 'supply', available: true, capacity: null, location: 'Meeting room' },
      { id: 'r5', name: 'Conference Room B', type: 'room', available: true, capacity: 14, location: 'Floor 2' },
      // ----- 5 NEW RESOURCES -----
      { id: 'r6', name: 'VR Headset', type: 'equipment', available: true, capacity: 1, location: 'Lab 1' },
      { id: 'r7', name: 'Podcast Studio', type: 'room', available: true, capacity: 4, location: 'Floor 1' },
      { id: 'r8', name: 'Standing Desk Pro', type: 'workspace', available: true, capacity: 1, location: 'Open space' },
      { id: 'r9', name: '3D Printer', type: 'equipment', available: true, capacity: null, location: 'Maker Space' },
      { id: 'r10', name: 'Breakout Room C', type: 'room', available: true, capacity: 6, location: 'Floor 2' }
    ];

    let bookings = []; // { resourceId, resourceName, user, timestamp, note, date }

    // DOM refs
    const gridEl = document.getElementById('resourceGrid');
    const selectEl = document.getElementById('resourceSelect');
    const userNameInput = document.getElementById('userNameInput');
    const bookingDateTime = document.getElementById('bookingDateTime');
    const bookingNote = document.getElementById('bookingNote');
    const bookBtn = document.getElementById('bookBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const logList = document.getElementById('logList');
    const logCount = document.getElementById('logCount');
    const filterType = document.getElementById('filterType');
    const filterStatus = document.getElementById('filterStatus');
    const searchInput = document.getElementById('searchInput');

    const totalResourcesSpan = document.getElementById('totalResources');
    const availableCountSpan = document.getElementById('availableCount');
    const bookingCountSpan = document.getElementById('bookingCount');
    const uniqueUsersSpan = document.getElementById('uniqueUsers');

    // ----- helpers -----
    function getFilteredResources() {
      let list = [...resources];
      const type = filterType.value;
      const status = filterStatus.value;
      const query = searchInput.value.toLowerCase().trim();
      if (type !== 'all') list = list.filter(r => r.type === type);
      if (status === 'available') list = list.filter(r => r.available);
      else if (status === 'booked') list = list.filter(r => !r.available);
      if (query) list = list.filter(r => r.name.toLowerCase().includes(query) || r.location?.toLowerCase().includes(query));
      return list;
    }

    function updateStats() {
      const total = resources.length;
      const available = resources.filter(r => r.available).length;
      const bookedCount = bookings.length;
      const users = new Set(bookings.map(b => b.user?.toLowerCase())).size;
      totalResourcesSpan.textContent = total;
      availableCountSpan.textContent = available;
      bookingCountSpan.textContent = bookedCount;
      uniqueUsersSpan.textContent = users;
    }

    function renderResources() {
      const filtered = getFilteredResources();
      if (filtered.length === 0) {
        gridEl.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:2.5rem;"><i class="fas fa-box-open fa-2x" style="opacity:0.4;"></i><p style="margin-top:0.5rem;">no resources match</p></div>`;
        return;
      }
      let html = '';
      filtered.forEach(res => {
        const statusClass = res.available ? '' : 'booked';
        const statusText = res.available ? 'available' : 'booked';
        const cap = res.capacity ? `<span class="capacity"><i class="fas fa-user"></i> ${res.capacity}</span>` : '';
        html += `
          <div class="resource-card" data-id="${res.id}">
            <div class="card-top">
              <h3>${res.name}</h3>
              <span class="type-badge">${res.type}</span>
            </div>
            <div class="meta-line">
              <span><i class="fas fa-map-pin"></i> ${res.location || '—'}</span>
              ${cap}
            </div>
            <span class="status-pill ${statusClass}"><i class="fas ${res.available ? 'fa-circle' : 'fa-circle'}"></i> ${statusText}</span>
            <div class="card-actions">
              <button class="btn btn-primary book-action" data-id="${res.id}" ${!res.available ? 'disabled' : ''}><i class="fas fa-bookmark"></i> book</button>
              <button class="btn btn-outline toggle-action" data-id="${res.id}"><i class="fas fa-sync-alt"></i> toggle</button>
            </div>
          </div>
        `;
      });
      gridEl.innerHTML = html;
    }

    function populateSelect() {
      const available = resources.filter(r => r.available);
      selectEl.innerHTML = '';
      if (available.length === 0) {
        selectEl.innerHTML = `<option value="">— none available —</option>`;
        return;
      }
      available.forEach(res => {
        const opt = document.createElement('option');
        opt.value = res.id;
        opt.textContent = `${res.name} (${res.type})`;
        selectEl.appendChild(opt);
      });
    }

    function renderLog() {
      if (bookings.length === 0) {
        logList.innerHTML = `<div class="empty-log"><i class="fas fa-inbox"></i> no bookings yet</div>`;
        logCount.textContent = '(0)';
        return;
      }
      let html = '';
      const sorted = [...bookings].reverse();
      sorted.forEach(b => {
        const timeStr = b.timestamp ? new Date(b.timestamp).toLocaleString('en-US', {hour:'2-digit', minute:'2-digit', month:'short', day:'numeric'}) : '—';
        const noteStr = b.note ? ` <span class="badge">${b.note}</span>` : '';
        const dateStr = b.date ? ` <span class="badge"><i class="far fa-calendar-alt"></i> ${new Date(b.date).toLocaleDateString()}</span>` : '';
        html += `
          <div class="log-item">
            <div class="left">
              <i class="fas fa-user-circle" style="color:#2563eb;"></i>
              <span><strong>${b.resourceName}</strong></span>
              <span class="badge">${b.user || 'guest'}</span>
              ${noteStr}
              ${dateStr}
            </div>
            <span class="timestamp"><i class="far fa-clock"></i> ${timeStr}</span>
          </div>
        `;
      });
      logList.innerHTML = html;
      logCount.textContent = `(${bookings.length})`;
    }

    function refreshUI() {
      renderResources();
      populateSelect();
      renderLog();
      updateStats();
    }

    // ----- core actions -----
    function bookResource(resourceId, userName, dateTime, note) {
      if (!resourceId) { alert('select a resource'); return false; }
      const res = resources.find(r => r.id === resourceId);
      if (!res) { alert('resource not found'); return false; }
      if (!res.available) { alert(`"${res.name}" is already booked.`); return false; }

      res.available = false;
      const entry = {
        resourceId: res.id,
        resourceName: res.name,
        user: userName.trim() || 'guest',
        timestamp: Date.now(),
        date: dateTime || null,
        note: note || null,
      };
      bookings.push(entry);
      refreshUI();
      return true;
    }

    function toggleAvailability(resourceId) {
      const res = resources.find(r => r.id === resourceId);
      if (!res) return;
      res.available = !res.available;
      refreshUI();
    }

    function resetAll() {
      if (!confirm('Reset all resources to available and clear bookings?')) return;
      resources.forEach(r => r.available = true);
      bookings = [];
      refreshUI();
    }

    function clearLog() {
      bookings = [];
      refreshUI();
    }

    // ----- event delegation -----
    function setupEvents() {
      gridEl.addEventListener('click', (e) => {
        const target = e.target.closest('button');
        if (!target) return;
        if (target.classList.contains('book-action')) {
          const id = target.dataset.id;
          if (id) {
            const name = userNameInput.value || 'guest';
            const date = bookingDateTime.value || null;
            const note = bookingNote.value || null;
            bookResource(id, name, date, note);
          }
        }
        if (target.classList.contains('toggle-action')) {
          const id = target.dataset.id;
          if (id) toggleAvailability(id);
        }
      });

      bookBtn.addEventListener('click', () => {
        const id = selectEl.value;
        const name = userNameInput.value || 'guest';
        const date = bookingDateTime.value || null;
        const note = bookingNote.value || null;
        if (!id) { alert('please select a resource'); return; }
        bookResource(id, name, date, note);
      });

      resetAllBtn.addEventListener('click', resetAll);
      clearLogBtn.addEventListener('click', clearLog);

      // filters
      filterType.addEventListener('change', refreshUI);
      filterStatus.addEventListener('change', refreshUI);
      searchInput.addEventListener('input', refreshUI);

      // quick enter on name
      userNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') bookBtn.click(); });
      bookingNote.addEventListener('keypress', (e) => { if (e.key === 'Enter') bookBtn.click(); });
    }

    // ----- init with demo data (now with more variety) -----
    function init() {
      // seed demo bookings across resources
      const demo = [
        { resourceId: 'r1', resourceName: 'Meeting Room A', user: 'Alice', timestamp: Date.now() - 7200000, note: 'daily standup' },
        { resourceId: 'r3', resourceName: 'Desk 12', user: 'Bob', timestamp: Date.now() - 3600000, note: 'focus work' },
        { resourceId: 'r6', resourceName: 'VR Headset', user: 'Carol', timestamp: Date.now() - 1800000, note: 'testing' }
      ];
      demo.forEach(b => {
        const res = resources.find(r => r.id === b.resourceId);
        if (res && res.available) {
          res.available = false;
          bookings.push(b);
        }
      });
      // set default datetime
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      bookingDateTime.value = now.toISOString().slice(0, 16);

      refreshUI();
      setupEvents();
    }

    init();
  })();
</script>
</body>
</html>
